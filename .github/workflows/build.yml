name: Build Ch3ss Client IPA

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Unsigned App & Safari Extension
        run: |
          PROJ_PATH=$(find . -maxdepth 2 -name "Ch3ssClient-iOS.xcodeproj" | head -n 1)
          echo "Building project: $PROJ_PATH"
          xcodebuild \
            -project "$PROJ_PATH" \
            -scheme Ch3ssClient \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Verify Safari Extension & Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Ch3ssClient.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/PlugIns/Ch3ssClientExtension.appex/manifest.json"
          test -f "$APP_PATH/PlugIns/Ch3ssClientExtension.appex/vendor/stockfish.js"
          rm -rf Payload Ch3ssClient-v1.2.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -9 Ch3ssClient-v1.2.ipa Payload
          ls -lh Ch3ssClient-v1.2.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ch3ssClient-v1.2-IPA
          path: Ch3ssClient-v1.2.ipa
